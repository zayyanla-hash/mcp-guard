name: vambrace-fixtures-sarif
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Run Vambrace action on fixtures/vulnerable
        id: audit
        continue-on-error: true
        uses: ./action
        with:
          target: fixtures/vulnerable
          threshold: medium
          sarif-file: /tmp/vambrace-vulnerable.sarif
          upload-sarif: 'true'
      - name: Verify fixtures/vulnerable produces exit 1 and valid SARIF
        run: |
          test "${{ steps.audit.outputs.exit-code }}" = "1"
          test -s /tmp/vambrace-vulnerable.sarif
