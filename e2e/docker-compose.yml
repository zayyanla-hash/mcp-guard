services:
  fixture-server:
    image: node@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    working_dir: /app
    command: ["node", "e2e/fixture-server.mjs"]
    environment:
      PORT: "3001"
      DRIFT_MODE: "${DRIFT_MODE:-0}"
    volumes:
      - ../:/app:ro
    ports:
      - "3001:3001"

  agentgateway:
    image: ghcr.io/agentgateway/agentgateway@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
    command: ["-f", "/config/agentgateway.yaml"]
    depends_on:
      - fixture-server
    volumes:
      - ./artifacts/agentgateway.yaml:/config/agentgateway.yaml:ro
    ports:
      - "3000:3000"

  test-client:
    image: node@sha256:116b800c3754b440ee0aa3ed2f20f5bf3d99a554bfd9adeea09ea8017f6e85f5
    working_dir: /app
    depends_on:
      - agentgateway
    environment:
      GATEWAY_URL: "http://agentgateway:3000/mcp"
      EXPECT_LOOKUP: "${EXPECT_LOOKUP:-allow}"
    volumes:
      - ../:/app:ro
    command: ["node", "e2e/test-client.mjs"]
